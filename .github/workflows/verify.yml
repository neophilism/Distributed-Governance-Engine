name: Foundation verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify runtime
        run: docker run --rm -v "$PWD:/work" -w /work node:24.19.0-alpine sh -c 'npm ci --ignore-scripts && npm run check && npm run build'
