name: Prepare Yjs dependency lock
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-collaboration-lock.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'work/dce-008-yjs-collaboration-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
      - name: Generate exact lockfile in disposable CI worker
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact yjs@13.6.27 y-prosemirror@1.3.7 y-websocket@3.1.0 ws@8.22.0
          node --input-type=commonjs <<'NODE'
          const fs=require('node:fs');
          for (const [tag,path] of [['PKG','package.json'],['LOCK','package-lock.json']]) {
            const json=JSON.stringify(fs.readFileSync(path,'utf8'));
            for(let at=0;at<json.length;at+=900) {
              process.stdout.write('DGE_'+tag+'_CHUNK '+Math.floor(at/900)+' '+json.slice(at,at+900)+'\n');
            }
          }
          NODE
